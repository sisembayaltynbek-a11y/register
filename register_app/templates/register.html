{% block content %}
<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Тіркелу</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            width: 475px;
            height: 540px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 95%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <form method="post">
        {% csrf_token %}<br><br><br>
        <h1>Тіркелу</h1><br><br>

        <label for="fullname">Аты-жөніңіз:</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="schoolname">Мектеп атауы:</label>
        <input type="text" id="schoolname" name="schoolname" required>

        <label for="area">Аймақ:</label>
        <input type="text" id="area" name="area" required><br><br><br>

        <input type="submit" value="Тіркелу"><br><br><br>
    </form>
</body>
</html>
{% endblock %}
