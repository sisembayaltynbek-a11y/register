{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registered Users</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f8f8f8;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 80%;
            margin: 0 auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px 15px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        button{
            width: 40%;
            margin: 0 auto;
            padding: 10px 5px;
            border-collapse: collapse;
            background-color: #4CAF50;
            border: none;
            border-radius: 52px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body><br>
    <h1>Тіркелген адамдар информациясы</h1><br>
    <table>
        <tr>
            <th>Аты жөні</th>
            <th>Мектеп атауы</th>
            <th>Аудан атауы</th>
        </tr>
        {% for user in people %}
        <tr>
            <td>{{ user.fullname }}</td>
            <td>{{ user.schoolname }}</td>
            <td>{{ user.area }}</td>
        </tr>
        {% endfor %}
    </table><br>
    <a href="{% url 'export_registers' %}">
        <button>Download Excel</button>
    </a>
</body>
</html>
{% endblock %}
