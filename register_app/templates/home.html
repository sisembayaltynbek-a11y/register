{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px;
            background-color: #f0f0f0;
        }

        h1 {
            color: #333;
        }

        p {
            color: #555;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Сәлеметсіз бе!</h1>
    <p>Жайлы мектепке қош келдіңіз!</p>
    <img src="{% static 'images/image.png' %}" alt="School Image" style="width: 300px; height: auto; margin-top: 20px;"><br>
    <a href="{% url 'register' %}" class="button">Тіркелу</a>
</body>
</html>
